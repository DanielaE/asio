name: Clang

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang:
    strategy:
      fail-fast: false
      matrix:
        version: [21, 22]
        cxx_config:
          - { std: 20, import_std: "OFF" }
          - { std: 23, import_std: "ON" }
        build_type: [debug, release]

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/mattkretz/cplusplus-ci/clang${{ matrix.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - name: Install libssl-dev
        run: apt-get update -qq && apt-get install -y -qq libssl-dev unzip

      - name: Setup build environment
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "^4.3.4"
          # (e.g., matching any 4.x.x version equal to or greater than 4.3.4, but below 5.0.0)
          ninjaVersion: "~1.13.0"
          # (matching >= 1.13.0 and < 1.14.0)

      - name: Configure CMake
        env:
          CXX: clang++
          PATH: $HOME/.local/bin:$PATH
        run: cmake --preset linux-clang --log-level=VERBOSE -D CMAKE_CXX_STANDARD=${{ matrix.cxx_config.std }} -D ASIO_IMPORT_STD=${{ matrix.cxx_config.import_std }}

      - name: Build
        env:
          PATH: $HOME/.local/bin:$PATH
        run: cmake --build --preset linux-clang-${{ matrix.build_type }}

      - name: Test
        env:
          PATH: $HOME/.local/bin:$PATH
        run: ctest --preset linux-clang-${{ matrix.build_type }}
