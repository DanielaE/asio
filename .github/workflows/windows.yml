name: windows

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025-vs2026]
        cxx_config:
          - { std: 20, import_std: "OFF" }
          - { std: 23, import_std: "ON" }
        build_type: [debug, release]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          cmake: 4.2.3
          ninja: 1.13.0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and Test
        shell: pwsh
        run: |
          cmake --preset windows-msvc -D CMAKE_CXX_STANDARD=${{ matrix.cxx_config.std }} -D ASIO_IMPORT_STD=${{ matrix.cxx_config.import_std }}
          cmake --build --preset windows-msvc-${{ matrix.build_type }}
          ctest --preset windows-msvc-${{ matrix.build_type }}

